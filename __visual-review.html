<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hinode display review</title><style>html,body{margin:0;background:#dce1e8;font:13px sans-serif}header{padding:10px 20px;background:#0c1d42;color:white;display:flex;gap:16px;align-items:center}select,button{font:inherit;padding:7px}iframe{display:block;border:0;margin:18px auto;background:white;box-shadow:0 0 0 1px #b7c0cc}#status{margin-left:auto}a{color:white}</style></head><body><header><label>Page <select id="route"></select></label><label>Width <select id="width"><option>1363</option><option>390</option><option>320</option></select></label><button id="load">Show</button><span id="status">Loading</span></header><iframe id="review" title="Page layout review"></iframe><script>
const routes=['index','service','senryaku','ma','global','kanri','kaikei','dx','member','company','contact','privacy','ma-guideline'];
const params=new URLSearchParams(location.search), route=document.querySelector('#route'),width=document.querySelector('#width'),frame=document.querySelector('#review');
route.innerHTML=routes.map(x=>'<option>'+x+'</option>').join('');route.value=routes.includes(params.get('page'))?params.get('page'):'index';width.value=['1363','390','320'].includes(params.get('width'))?params.get('width'):'1363';
async function load(){document.querySelector('#status').textContent='Loading';frame.style.width=width.value+'px';frame.style.height='1px';const html=await(await fetch('src/pages/'+route.value+'.html?v='+Date.now())).text();frame.onload=async()=>{const d=frame.contentDocument;await d.fonts.ready;await Promise.all([...d.images].map(x=>x.decode().catch(()=>{})));const resize=()=>{frame.style.height=Math.ceil(d.body.scrollHeight+2)+'px';document.querySelector('#status').textContent='Ready · '+route.value+' · '+width.value+'px';};resize();setTimeout(resize,1200);};frame.srcdoc=html.replace('<head>','<head><base href="'+new URL('./',location.href).href+'">').replace('</head>','<style>html{scroll-behavior:auto!important}html.js .reveal,html.js .reveal-item,html.js .reveal-text,.line-inner,.eyebrow,.hero .lead,.cta-row,.scroll-cue{opacity:1!important;transform:none!important;animation:none!important;transition:none!important}.reveal-list>*{opacity:1!important;transform:none!important;transition:none!important}body{min-height:0!important}#floatPill{display:none!important}</style></head>');history.replaceState(null,'','?page='+route.value+'&width='+width.value);}
document.querySelector('#load').onclick=load;load();
</script></body></html>
