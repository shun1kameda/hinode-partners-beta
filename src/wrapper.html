<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>日の出パートナーズ株式会社｜β版</title>
<meta name="description" content="ともに未来を照らし、持続的な価値を創造するパートナー">
<meta name="description" content="ともに未来を照らし、持続的な価値を創造するパートナー">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#F2F1EE}
#siteFrame{display:block;width:100%;height:100%;border:0;background:#F2F1EE}
#boot{position:fixed;inset:0;display:grid;place-items:center;background:#0C1D42;color:#D8BD8E;font:12px/1.6 system-ui,sans-serif;letter-spacing:.18em;z-index:2;transition:opacity .25s}
#boot.is-hidden{opacity:0;pointer-events:none}
</style>
</head>
<body>
<noscript><style>#boot,#siteFrame{display:none}html,body{overflow:auto;height:auto}body{padding:2rem;box-sizing:border-box}</style><p>日の出パートナーズ株式会社</p><p>メール：<a href="mailto:info@hinode.partners">info@hinode.partners</a></p><p>サイトをご覧いただくにはJavaScriptを有効にしてください。</p></noscript>
<noscript><p>日の出パートナーズ株式会社</p><p>メール：<a href="mailto:info@hinode.partners">info@hinode.partners</a></p><p>サイトをご覧いただくにはJavaScriptを有効にしてください。</p></noscript>
<div id="boot">HINODE PARTNERS</div>
<iframe id="siteFrame" title="日の出パートナーズ株式会社 β版"></iframe>
<script>
const PAGE_B64 = __PAGE_DATA__;
const PAGE_TITLES = __PAGE_TITLES__;
const ROUTES = new Set(Object.keys(PAGE_B64));
const frame = document.getElementById('siteFrame');
const boot = document.getElementById('boot');
const cache = new Map();
let loadingKey = '';
function decodeUtf8Base64(s){
  const bin=atob(s), bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}
function pageHtml(route){
  if(!cache.has(route)) cache.set(route, decodeUtf8Base64(PAGE_B64[route]));
  return cache.get(route);
}
function parseHash(){
  let raw=(location.hash||'#index').slice(1);
  if(raw.startsWith('/')) raw=raw.slice(1);
  let parts=raw.split('/');
  let route='index'; try { route=decodeURIComponent(parts.shift()||'index'); } catch {}
  let anchor=''; try { anchor=parts.length?decodeURIComponent(parts.join('/')):''; } catch {}
  if(!ROUTES.has(route)) route='index';
  return {route,anchor};
}
function routeKey(s){return s.route+'|'+(s.anchor||'')}
function renderFromHash(){
  const s=parseHash(), key=routeKey(s);
  if(loadingKey===key) return;
  loadingKey=key;
  boot.classList.remove('is-hidden');
  document.title=(PAGE_TITLES[s.route]||'日の出パートナーズ株式会社')+'｜β版';
  frame.onload=function(){
    boot.classList.add('is-hidden');
    if(s.anchor){
      setTimeout(function(){frame.contentWindow.postMessage({type:'hinode-beta-anchor',anchor:s.anchor},'*')},40);
    }
  };
  frame.srcdoc=pageHtml(s.route);
}
window.addEventListener('message',function(e){
  const d=e.data||{};
  if(e.source!==frame.contentWindow) return;
  if(e.source!==frame.contentWindow) return;
  if(d.type!=='hinode-beta-route'||!ROUTES.has(d.route)) return;
  const h='#'+encodeURIComponent(d.route)+(d.anchor?'/'+encodeURIComponent(d.anchor):'');
  if(location.hash===h){loadingKey='';renderFromHash()} else location.hash=h;
});
window.addEventListener('hashchange',function(){loadingKey='';renderFromHash()});
if(!location.hash) location.replace('#index'); else renderFromHash();
</script>
</body>
</html>
